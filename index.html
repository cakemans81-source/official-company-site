      <h1>(주)이루 IRU — 자동차 시트 목업 및 모빌리티 시제품 전문 제작</h1>
      <p>(주)이루는 2022년 설립된 경기도 화성 소재 프리미엄 목업 제작사입니다. 슬로건은 “LET'S MAKE IT HAPPEN”입니다. 독자적인 건식 정밀 가공 기술을 바탕으로 우레탄 폼 스폰지부터 엔지니어링 플라스틱, 금속 기구물, 최고급 가죽 및 원단 봉제 샘플까지 양산 전 단계의 완성도 높은 시제품을 원스톱으로 제작합니다.</p>

      <h2>핵심 제작 분야 및 서비스</h2>
      <ul>
        <li><strong>디자인 목업 (Design Mock-up)</strong>: 양산 전 외관, 형상, 표면 질감을 1:1 스케일로 검증하는 실물 시각 목업</li>
        <li><strong>차량 시트 워킹 목업 (Automotive Working Mock-up)</strong>: 슬라이드, 리클라이너, 스위블 등 구동 메커니즘을 적용한 개발 검증용 시트 목업</li>
        <li><strong>하이엔드 CMF &amp; 정밀 패턴 (High-end CMF &amp; Stitching)</strong>: 최고급 가죽, 친환경 원단, 고난도 정밀 자수 및 스티치 패턴 샘플</li>
        <li><strong>VIP 시트 튜닝 &amp; 리무진 커스텀</strong>: 의전용 리무진 시트, 특장차 맞춤형 편의 기능 탑재 시트 제작</li>
        <li><strong>로보틱스 워킹 목업 (Robotics Mock-up)</strong>: 휴머노이드 로봇 관절 및 구동 액추에이터 기구 검증 목업</li>
      </ul>

      <h2>4단계 정밀 목업 제작 공정</h2>
      <ol>
        <li><strong>01. 디자인 및 3D 엔지니어링 (Design &amp; 3D Engineering)</strong>: 도면 분석, 3D 데이터 모델링 및 분할 설계</li>
        <li><strong>02. 건식 정밀 가공 (Precision Machining)</strong>: 우레탄 폼(시트 스폰지), 수지, 금속 프레임 정밀 CNC 건식 가공</li>
        <li><strong>03. 후처리 및 CMF 마감 (Post-Processing)</strong>: 표면 샌딩, 도색, 특수 질감 및 CMF 구현</li>
        <li><strong>04. 디테일 조립 및 검수 (Detail Assembly)</strong>: 정밀 봉제 트림, 기구 조립, 최종 치수 및 작동 검사</li>
      </ol>

      <h2>주요 포트폴리오 레퍼런스</h2>
      <ul>
        <li>현대자동차 MobED(모베드) 외관 목업</li>
        <li>기아 PBV5 전용 1열 및 3열 시트 목업</li>
        <li>현대 WIA 디자인 모델</li>
        <li>휴머노이드 로봇 구동 검증 워킹 모델</li>
        <li>하이엔드 소프트 트림 정밀 스티칭 디테일</li>
      </ul>
